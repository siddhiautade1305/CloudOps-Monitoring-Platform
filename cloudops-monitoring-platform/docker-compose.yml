services:
  # ---------------------------------------------------------
  # Prometheus: Time Series Database and Alerting Engine
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      # Mount configuration file
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Persistent storage for metrics
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------
  # Grafana: Data Visualization and Dashboards
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    restart: unless-stopped
    volumes:
     
       # Persistent Grafana database, users and configuration
      - grafana_data:/var/lib/grafana

      # Grafana provisioning configuration
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # Provisioned dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Default admin credentials (for local dev, avoid hardcoding in prod)
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
    - prometheus

  # ---------------------------------------------------------
  # Node Exporter: Hardware and OS metrics exporter (Host)
  # ---------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      # Mount host OS directories as read-only to extract metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      # Exclude synthetic mount points
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------
  # cAdvisor: Container metrics exporter
  # ---------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    # cAdvisor only reads runtime and cgroup state; do not grant broad host privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------
  # Demo App 1: Web Service (Observable Target)
  # ---------------------------------------------------------
  demo-app:
    image: nginx:1.25.1-alpine
    container_name: demo-app
    restart: unless-stopped
    ports:
      # Exposing for demonstration, but not strictly required
      - "80:80"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------
  # Demo App 2: CPU Loader (Observable Target)
  # ---------------------------------------------------------
  demo-worker:
    image: alpine:3.18
    container_name: demo-worker
    restart: unless-stopped
    # Runs an infinite loop creating small CPU spikes every few seconds
    command: /bin/sh -c "while true; do yes > /dev/null & sleep 1; kill $$!; sleep 2; done"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    name: monitoring
    driver: bridge
